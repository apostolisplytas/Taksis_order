<style>
  :root{
    --bg:#0b0a09; --panel:#1a1817; --panel2:#211f1d; --border:#2a2724; --border2:#413c37;
    --text:#f5f2ee; --muted:#a39a90; --muted2:#756c63;
    --amber:#e8a13d; --amber-bright:#f5b754; --frost:#6fb8c9; --frost-bright:#8fcddb;
    --red:#f0847a; --green:#7fc99a;
    --brand:#1d9e75; --brand-bright:#34c495; --brand-deep:#085041; --brand-mint:#9fe1cb;
    --font-display:"Fraunces",Georgia,serif; --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  #root{padding-bottom:100px;}
  .app-shell{max-width:780px;margin:0 auto;}
  .sidebar{display:none;}
  @media (min-width:960px){
    .app-shell{max-width:1180px;display:flex;align-items:flex-start;gap:0;}
    .main-col{flex:1;min-width:0;}
    .main-col header{display:none;}
    .main-col main{max-width:780px;margin:0 auto;}
    .sidebar{
      display:flex;flex-direction:column;gap:26px;
      width:250px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;
      padding:26px 20px;border-right:1px solid var(--border);
    }
    .sidebar-brand{display:flex;align-items:center;gap:10px;}
    .sidebar-brand svg{flex-shrink:0;}
    .sidebar-brand .wordmark{height:24px;width:auto;}
    .sidebar-module{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:1.8px;font-weight:600;margin-top:-14px;}
    .sidebar-nav{display:flex;flex-direction:column;gap:2px;}
    .sidebar-nav button{
      display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--muted);
      font-size:13.5px;font-weight:500;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;
      transition:background 0.15s,color 0.15s;
    }
    .sidebar-nav button svg{flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:0.85;}
    .sidebar-nav button:hover{background:var(--panel);color:var(--text);}
    .sidebar-nav button.active{background:rgba(29,158,117,0.14);color:var(--brand-bright);font-weight:650;}
    .sidebar-stats{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--border);padding-top:18px;}
    .sidebar-stats-title{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:1.2px;font-weight:600;margin-bottom:6px;}
    .stat-row{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--muted);font-size:12.5px;padding:7px 8px;border-radius:7px;cursor:pointer;text-align:left;width:100%;}
    .stat-row:hover{background:var(--panel);color:var(--text);}
    .stat-row span:nth-child(2){flex:1;}
    .stat-row strong{font-family:var(--font-display);font-size:14px;color:var(--text);font-weight:600;}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0;}
    .dot.brand{background:var(--brand);}
    .dot.red{background:var(--red);}
    .dot.amber{background:var(--amber);}
  }
  header{position:sticky;top:0;background:rgba(11,10,9,0.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:40;}
  header .chainbar{height:2.5px;background:linear-gradient(90deg,var(--brand-deep) 0%,var(--brand) 55%,var(--brand-mint) 100%);}
  header .top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px;}
  header .brand{display:flex;align-items:center;gap:10px;}
  header .brand svg{flex-shrink:0;display:block;}
  header .wordmark{height:22px;width:auto;display:block;}
  header h1{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0;color:#fbeed9;letter-spacing:-0.2px;}
  header .tag{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:1.8px;font-weight:600;}
  nav{display:flex;gap:2px;overflow-x:auto;padding:0 10px;}
  nav::-webkit-scrollbar{display:none;}
  nav button{background:none;border:none;color:var(--muted2);font-size:13px;font-weight:500;padding:11px 13px;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer;transition:color 0.15s;}
  nav button:hover{color:var(--muted);}
  nav button.active{color:var(--brand-bright);border-color:var(--brand);}
  main{padding:22px 16px;}
  .card{border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:13px 14px;margin-bottom:8px;transition:border-color 0.15s;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .muted{color:var(--muted);font-size:12px;line-height:1.5;}
  .muted2{color:var(--muted2);}
  input,select,textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 12px;font-size:14px;width:100%;font-family:inherit;transition:border-color 0.15s;}
  input[type="date"]{color-scheme:dark;}
  input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;padding:4px;border-radius:5px;}
  input[type="date"]::-webkit-calendar-picker-indicator:hover{background:var(--panel2);}
  textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);}
  input::placeholder,textarea::placeholder{color:var(--muted2);}
  label{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted2);display:block;margin-bottom:5px;font-weight:600;}
  button.btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:9px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:background 0.15s,border-color 0.15s;}
  button.btn:hover{background:#28241f;border-color:var(--border2);}
  button.btn-primary{background:var(--brand);color:#082019;font-weight:650;border-color:var(--brand);}
  button.btn-primary:hover{background:var(--brand-bright);border-color:var(--brand-bright);}
  button.btn-danger-outline{background:none;border:1px solid rgba(240,132,122,0.4);color:var(--red);}
  button.btn-danger-outline:hover{background:rgba(240,132,122,0.08);}
  button.icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  button.link{background:none;border:none;color:var(--muted);font-size:12px;padding:6px 8px;cursor:pointer;}
  button.link:hover{color:var(--text);}
  button.danger{background:none;border:none;color:var(--muted2);padding:6px;cursor:pointer;}
  button.danger:hover{color:var(--red);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .qtybtn{width:30px;height:30px;border-radius:8px;background:var(--panel2);color:var(--text);border:1px solid var(--border);font-size:15px;cursor:pointer;transition:background 0.15s;}
  .qtybtn:hover{background:#28241f;}
  .qtyinput{width:52px;text-align:center;padding:5px;border-radius:8px;}
  .tabs2{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;margin-bottom:12px;}
  .tabs2 button{border:none;background:none;color:var(--muted);font-size:12px;font-weight:500;padding:7px 13px;border-radius:7px;cursor:pointer;transition:background 0.15s,color 0.15s;}
  .tabs2 button.active{background:var(--brand);color:#082019;font-weight:650;}
  .stat{border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:14px;border-left:3px solid var(--border2);}
  .stat .v{font-family:var(--font-display);font-size:24px;font-weight:600;margin-top:5px;letter-spacing:-0.3px;}
  .stat.accent-amber{border-left-color:var(--brand);}
  .stat.accent-frost{border-left-color:var(--frost);}
  .stat.accent-red{border-left-color:var(--red);}
  .lowstock{border-color:rgba(240,132,122,0.3);background:rgba(120,45,40,0.12);}
  .expiring{border-color:rgba(232,161,61,0.35);background:rgba(110,74,20,0.14);}
  .expired{border-color:rgba(240,132,122,0.4);background:rgba(120,45,40,0.18);}
  .card.in-cart{border-color:rgba(29,158,117,0.45);}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#f5f2ee;color:#1c1917;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:550;box-shadow:0 8px 30px rgba(0,0,0,0.45);z-index:50;max-width:88%;text-align:center;}
  .center-note{text-align:center;color:var(--muted2);font-size:13px;padding:34px 0;}
  .configbox{border:1px solid var(--brand);background:rgba(29,158,117,0.08);border-radius:12px;padding:18px;margin:16px;font-size:13px;line-height:1.65;}
  .configbox code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:12px;}
  .stickybar{position:sticky;bottom:0;background:rgba(11,10,9,0.97);backdrop-filter:blur(10px);border-top:1px solid var(--border);margin:0 -16px;padding:11px 16px 15px;}
  .lotrow{border-top:1px solid var(--border);padding-top:9px;margin-top:9px;}
  .badge{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;padding:3px 7px;border-radius:6px;background:var(--panel2);color:var(--muted2);font-weight:600;}
  .badge.warn{background:rgba(110,74,20,0.5);color:var(--amber-bright);}
  .badge.bad{background:rgba(120,45,40,0.5);color:var(--red);}
  .badge.fresh{background:rgba(110,74,20,0.35);color:var(--amber-bright);}
  .badge.frost{background:rgba(30,80,92,0.4);color:var(--frost-bright);}
  .badge.cart{background:rgba(29,158,117,0.2);color:var(--brand-bright);text-transform:none;letter-spacing:0;font-weight:600;}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;white-space:nowrap;transition:background 0.15s,border-color 0.15s,color 0.15s;}
  .chip:hover{border-color:var(--border2);color:var(--text);}
  .chip.active{background:rgba(29,158,117,0.18);border-color:var(--brand);color:var(--brand-bright);font-weight:600;}
  .chipwrap{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow-y:auto;padding:2px;}
  a{color:var(--brand-bright);}
</style>
</head>

// Διαβάζει αρχείο κειμένου δοκιμάζοντας πρώτα UTF-8· αν το αρχείο δεν είναι έγκυρο UTF-8
// (συνηθισμένο σε CSV εξαγωγές από Excel σε Windows/ANSI), πέφτει πίσω σε Windows-1252
// ώστε να μη χαλάνε χαρακτήρες όπως °, º, €.
async function readFileSmart(file){
  const buf = await file.arrayBuffer();
  try {
    return new TextDecoder("utf-8", {fatal:true}).decode(buf);
  } catch(e){
    return new TextDecoder("windows-1252").decode(buf);
  }
}
// Μορφοποίηση χρηματικού ποσού σε ευρωπαϊκή μορφή: τελεία στις χιλιάδες, κόμμα στα δεκαδικά
// π.χ. formatEUR(492321.23) -> "€492.321,23"
function formatEUR(n, decimals){
  const d = decimals === undefined ? 2 : decimals;
  const num = Number(n || 0).toLocaleString("el-GR", {minimumFractionDigits:d, maximumFractionDigits:d});
  return "€" + num;
}
function toNumber(v){
  if (v === undefined || v === null || v === "") return 0;
  let s = String(v).trim();
  if (s === "") return 0;
  // αφαίρεση νομισμάτων/συμβόλων (€, $, £, κενά κ.λπ.) — κρατάμε μόνο ψηφία, κόμμα, τελεία, πρόσημο
  s = s.replace(/[^\d,.\-]/g, "");
  if (s === "") return 0;
  if (s.includes(",")){
    // κόμμα = υποδιαστολή· η τελεία (αν υπάρχει) θεωρείται διαχωριστικό χιλιάδων
    s = s.replace(/\./g, "").replace(",", ".");
  }
  const n = Number(s);
  return isNaN(n) ? 0 : n;
}
function parseDateFlexible(raw){
  if (!raw) return null;
  const s = String(raw).trim();
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m){
    let [_, d, mo, y] = m;
    if (y.length === 2) y = (Number(y) > 70 ? "19" : "20") + y;
    d = d.padStart(2,"0"); mo = mo.padStart(2,"0");
    return `${y}-${mo}-${d}`;
  }
  if (/^\d{5}$/.test(s)){
    // Excel serial date
    const ms = (Number(s) - 25569) * 86400 * 1000;
    const dt = new Date(ms);
    if (!isNaN(dt)) return dt.toISOString().slice(0,10);
  }
  return null;
}
function formatDateEL(iso){
  if (!iso) return "—";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function daysUntil(iso){
  if (!iso) return null;
  const today = new Date(todayISO()+"T00:00:00");
  const target = new Date(iso+"T00:00:00");
  return Math.round((target - today) / 86400000);
}
function bbdBadge(bbd){
  if (!bbd) return "";
  const days = daysUntil(bbd);
  if (days < 0) return `<span class="badge bad">έληξε ${formatDateEL(bbd)}</span>`;
  if (days <= EXPIRY_WARNING_DAYS) return `<span class="badge warn">λήγει σε ${days}ημ · ${formatDateEL(bbd)}</span>`;
  return `<span class="badge">${formatDateEL(bbd)}</span>`;
}
function zoneBadge(zone){
  if (!zone) return "";
  const isFrozen = /frz|congel|frozen|-18|congelado/i.test(zone);
  const cls = isFrozen ? "frost" : "fresh";
  return `<span class="badge ${cls}">${esc(zone)}</span>`;
}

}

async function loadAll(){
  const [aRes, sRes, cRes, oRes] = await Promise.all([
    sb.from("articles").select("*").is("deleted_at", null).order("name"),
    sb.from("stock_units").select("*").is("deleted_at", null),
    sb.from("customers").select("*").is("deleted_at", null).order("name"),
    sb.from("orders").select("*").is("deleted_at", null).order("created_at", {ascending:false})
  ]);
  [["articles",aRes],["stock_units",sRes],["customers",cRes],["orders",oRes]].forEach(([label,res])=>{
    if (res.error){ console.error(`load ${label} error`, res.error); showToast(`Σφάλμα φόρτωσης (${label}): ${res.error.message}`); }
  });
  state.articles = aRes.data || [];
  state.stockUnits = sRes.data || [];
  state.customers = cRes.data || [];
  state.orders = oRes.data || [];
  state.loaded = true;
  render();
}
async function loadTrash(){
  const [aRes, sRes, cRes, oRes] = await Promise.all([
    sb.from("articles").select("*").not("deleted_at","is",null).order("deleted_at",{ascending:false}),
    sb.from("stock_units").select("*").not("deleted_at","is",null).order("deleted_at",{ascending:false}),
    sb.from("customers").select("*").not("deleted_at","is",null).order("deleted_at",{ascending:false}),
    sb.from("orders").select("*").not("deleted_at","is",null).order("deleted_at",{ascending:false})

    orders: oRes.data || [],
  };
  render();
}

function splitTable(raw){
  raw = raw.replace(/^\uFEFF/, "");
  const lines = raw.trim().split("\n").map(l=>l.replace(/\r$/,"")).filter(l=>l.trim());
  if (lines.length < 2) return {headersRaw:[], rows:[]};
  const first = lines[0];
  let delim = ",";
  if (first.includes("\t")) delim = "\t";
  else if (!first.includes(",") && first.includes(";")) delim = ";";
  else if ((first.match(/;/g)||[]).length > (first.match(/,/g)||[]).length) delim = ";";
  const headersRaw = lines[0].split(delim).map(h=>h.trim());
  const rows = lines.slice(1).map(line => line.split(delim).map(c=>c.trim()));
  return {headersRaw, rows};
}
function parseGenericTable(raw){
  const {headersRaw, rows} = splitTable(raw);
  const headers = headersRaw.map(h=>h.toLowerCase());
  const objRows = rows.map(cells=>{
    const o = {};
    headers.forEach((h,i)=> o[h] = cells[i] !== undefined ? cells[i] : "");
    return o;
  });
  return {headers, rows: objRows};
}
const STOCK_ALIASES = {
  sscc: ["sscc"],
  articlecode: ["articlecode","code","articlecod"],
  articlename: ["articlename","name"],
  zone: ["zone","category"],
  volume: ["remainingvolume","volume","boxes","remainingvol","crates"],
  weight: ["weight","remainingweight"],
  lot: ["lotcode","lot"],
  bbd: ["bbd","expiry","expirationdate","bestbefore","bestbeforedate"],
  reference: ["reference","ref"],
  priceperkg: ["priceperkg","pricekg","avgpriceperkg","averagepriceperkg","unitpriceperkg","timikilo","timianakilo","averageprice","avgprice","price"],
};
const CUSTOMER_ALIASES = {
  code: ["customercode","code"],
  name: ["name"],
  vat: ["vat","vatnumber","afm"],
  commercialname: ["commercialname","commercial"],
  address: ["address"],
  area: ["area"],
  zip: ["zipcode","zip","postalcode","postcode"],

  fax: ["fax"],
  email: ["email","email1"],
  email2: ["email2","secondemail","emailb"],
  notes: ["notes","note","comments","remarks"],
};
function normKey(s){
  return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^\p{L}\p{N}]/gu,"");
}
function isScientificNotation(s){ return /^[0-9.]+e\+?\d+$/i.test(String(s).trim()); }
function guessCanonical(rawHeader, aliasSet){
  const n = normKey(rawHeader);
  if (aliasSet === "stock"){
    if (n.includes("sscc")) return "sscc";
    if (n.includes("articlecode") || (n.includes("article") && n.includes("code"))) return "articlecode";
    if (n.includes("articlename") || (n.includes("article") && n.includes("name"))) return "articlename";
    if (n.includes("zone")) return "zone";
    if (n.includes("volume") || n.includes("boxes") || n.includes("crate")) return "volume";
    if (n.includes("weight")) return "weight";
    if (n.includes("lot")) return "lot";
    if (n.includes("bbd") || n.includes("expir") || n.includes("bestbefore")) return "bbd";
    if (n.includes("reference") || n === "ref") return "reference";
    if (n.includes("price") || n.includes("timi")) return "priceperkg";
  } else {
    if (n.includes("code")) return "code";
    if (n === "name" || (n.includes("name") && !n.includes("commercial"))) return "name";
    if (n.includes("vat")) return "vat";
    if (n.includes("commercial")) return "commercialname";
    if (n.includes("address")) return "address";
    if (n.includes("area")) return "area";
    if (n.includes("zip") || n.includes("postal") || n.includes("postcode")) return "zip";
    if (n.includes("city")) return "city";
    if (n.includes("country")) return "country";
    if (n.includes("email2") || n.includes("emailb")) return "email2";
    if (n.includes("email")) return "email";
    if (n.includes("fax")) return "fax";
    if (n.includes("phone") || n.includes("tel") || n.includes("mobile")) return "phone";
    if (n.includes("note") || n.includes("comment") || n.includes("remark")) return "notes";
  }
  return null;
}
function buildCanonicalMap(aliasDict){
  const map = {};
  Object.entries(aliasDict).forEach(([canon, alts])=>{
    map[normKey(canon)] = canon;
    alts.forEach(a => map[normKey(a)] = canon);
  });
  return map;
}
function parseStockTable(raw){
  const {headersRaw, rows} = splitTable(raw);
  const canonicalFor = buildCanonicalMap(STOCK_ALIASES);
  const mappedHeaders = headersRaw.map(h => canonicalFor[normKey(h)] || guessCanonical(h,"stock"));
  const records = rows.map(cells=>{
    const rec = {};
    const custom = {};
    mappedHeaders.forEach((canon,i)=>{
      const val = (cells[i] !== undefined ? cells[i] : "").trim();
      if (canon) rec[canon] = val;
      else if (val) custom[headersRaw[i]] = val;
    });
    rec.custom = custom;
    return rec;
  });
  return {mappedHeaders, records};
}
function parseCustomerTable(raw){
  const {headersRaw, rows} = splitTable(raw);
  const canonicalFor = buildCanonicalMap(CUSTOMER_ALIASES);
  const mappedHeaders = headersRaw.map(h => canonicalFor[normKey(h)] || guessCanonical(h,"customer"));
  const records = rows.map(cells=>{
    const rec = {};
    mappedHeaders.forEach((canon,i)=>{
      const val = (cells[i] !== undefined ? cells[i] : "").trim();
      if (canon) rec[canon] = val;
    });
    return rec;
  });
  return {mappedHeaders, records};
}

/* ---------------- CSV export ---------------- */
function csvEscape(val){
  const s = String(val ?? "");
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function downloadCSV(filename, headers, rows){
  const lines = [headers.map(csvEscape).join(",")];
  rows.forEach(r => lines.push(r.map(csvEscape).join(",")));
  const csv = "\uFEFF" + lines.join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function orderLineValue(i){
  // Νέα λογική: αξία = κιλά × τιμή/κιλό (snapshot τη στιγμή της παραγγελίας).
  // Για παλιότερες παραγγελίες (πριν την αλλαγή) που δεν έχουν price_per_kg, πέφτει πίσω στο qty×price.
  if (i.value !== undefined && i.value !== null) return i.value;

  return (i.qty||0)*(i.price||0);
}

    });
  });
  if (rows.length===0) return showToast("Δεν υπάρχουν δεδομένα για εξαγωγή");
  downloadCSV(filename, headers, rows);
}

function setupGreekFont(doc){
  doc.addFileToVFS("NotoSans-Regular.ttf", NOTOSANS_REGULAR_B64);
  doc.addFont("NotoSans-Regular.ttf", "NotoSans", "normal");
  doc.addFileToVFS("NotoSans-Bold.ttf", NOTOSANS_BOLD_B64);
  doc.addFont("NotoSans-Bold.ttf", "NotoSans", "bold");
  doc.setFont("NotoSans", "normal");
}

function exportDeliverySlipPDF(order){
  if (!window.jspdf) return showToast("Η βιβλιοθήκη PDF δεν φορτώθηκε — έλεγξε τη σύνδεση internet");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  setupGreekFont(doc);
  const c = state.customers.find(x=>x.id===order.customer_id);

  doc.setFontSize(17);
  doc.text("Δελτίο Αποστολής", 14, 18);
  doc.setFontSize(10);
  doc.setTextColor(120);
  doc.text("taksis_order", 14, 25);

  doc.setTextColor(20);
  doc.setFontSize(11);
  doc.text(`${order.order_number || order.id}`, 196, 18, {align:"right"});
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text(formatDateEL(order.date), 196, 24, {align:"right"});

  let y = 38;
  doc.setDrawColor(220);
  doc.line(14, y, 196, y);
  y += 8;

  doc.setFontSize(9);
  doc.setTextColor(140);
  doc.text("ΠΑΡΑΛΗΠΤΗΣ", 14, y);
  y += 6;
  doc.setFontSize(12);
  doc.setTextColor(20);
  doc.text(c ? c.name : "—", 14, y);
  y += 6;

  doc.setFontSize(10);
  doc.setTextColor(60);
  const deliverySame = !c || c.delivery_same_as_billing !== false;
  const lines = c ? (deliverySame
    ? [c.address, [c.zip, c.city].filter(Boolean).join(" "), c.area, c.country]
    : [c.delivery_address, [c.delivery_zip, c.delivery_city].filter(Boolean).join(" "), c.delivery_area, c.delivery_country]
  ).filter(Boolean) : [];
  lines.forEach(l=>{ doc.text(l, 14, y); y += 5.5; });
  if (c && c.phone){ doc.text(`Τηλ: ${c.phone}`, 14, y); y += 5.5; }

  y += 6;
  doc.setDrawColor(220);
  doc.line(14, y, 196, y);
  y += 4;

  const rows = order.items.map(i=>[i.article_code, i.article_name, i.lot_code||"—", i.bbd?formatDateEL(i.bbd):"—", String(i.qty), Number(i.weight||0).toFixed(1)]);
  doc.autoTable({
    startY: y,
    head: [["Κωδ.","Είδος","Lot","BBD","Κιβώτια","Κιλά"]],
    body: rows,
    styles:{fontSize:9, font:"NotoSans"},
    headStyles:{fillColor:[8,80,65], textColor:255, font:"NotoSans", fontStyle:"bold"},
  });

  const totalBoxes = order.items.reduce((s,i)=>s+(i.qty||0),0);
  const totalWeight = order.items.reduce((s,i)=>s+(i.weight||0),0);
  let finalY = (doc.lastAutoTable && doc.lastAutoTable.finalY) || y+10;
  finalY += 8;
  doc.setFontSize(10);
  doc.setTextColor(20);
  doc.text(`Σύνολο: ${totalBoxes} κιβώτια · ${totalWeight.toFixed(1)} κιλά`, 14, finalY);

  finalY += 26;
  if (finalY < 270){
    doc.setDrawColor(180);
    doc.line(14, finalY, 84, finalY);
    doc.line(126, finalY, 196, finalY);
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text("Υπογραφή παραδίδοντος", 14, finalY+5);
    doc.text("Υπογραφή παραλήπτη", 126, finalY+5);
  }

  doc.save(`taksis_order-deltio-${order.order_number || order.id}.pdf`);
}

function exportOrdersPDF(ordersList, filename, title){
  if (ordersList.length===0) return showToast("Δεν υπάρχουν δεδομένα για εξαγωγή");
  if (!window.jspdf) return showToast("Η βιβλιοθήκη PDF δεν φορτώθηκε — έλεγξε τη σύνδεση internet");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:"landscape"});
  setupGreekFont(doc);
  doc.setFontSize(14);
  doc.text(title, 14, 15);
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text(`Εξαγωγή: ${formatDateEL(todayISO())}`, 14, 21);
  const rows = [];
  ordersList.forEach(o=>{
    const cname = custName(o.customer_id);
    o.items.forEach(i=>{
      rows.push([o.order_number?`${o.order_number}`:"", o.date, cname, i.article_code, i.article_name, i.lot_code||"", i.bbd?formatDateEL(i.bbd):"", String(i.qty), Number(i.weight||0).toFixed(1), Number(i.price_per_kg ?? 0).toFixed(2), orderLineValue(i).toFixed(2)]);
    });
  });
  doc.autoTable({
    startY: 26,
    head: [["Αρ.","Ημ/νία","Πελάτης","Κωδ.","Είδος","Lot","BBD","Κιβ.","Κιλά","€/κιλό","Σύνολο"]],
    body: rows,
    styles:{fontSize:8, font:"NotoSans"},
    headStyles:{fillColor:[232,161,61], textColor:30, font:"NotoSans", fontStyle:"bold"},
  });
  const totalBoxes = ordersList.reduce((s,o)=>s+orderTotalBoxes(o),0);

function computeCustomerStats(){

    byCustomer[key].boxes += orderTotalBoxes(o);

    byCustomer[key].value += orderTotal(o);
    byCustomer[key].orders += 1;
    o.items.forEach(i=>{

      ba[i.article_code].boxes += i.qty||0;

  return Object.entries(byCustomer).map(([id,v])=>({id, ...v})).sort((a,b)=>b.value-a.value);

// Ταξινομεί/φιλτράρει τις παρτίδες stock σύμφωνα με την τρέχουσα προβολή της Σύνοψης stock
// (Ανά προϊόν / κωδικό / κατηγορία / ημ. λήξης / επόμενες 30 ημέρες), ώστε η εξαγωγή να
// αντιστοιχεί ακριβώς σε αυτό που βλέπει ο χρήστης στην οθόνη.
function getStockExportPairs(){
  let pairs = state.stockUnits
    .filter(u=>(u.volume_boxes>0||u.weight_kg>0))
    .map(u=>({u, a: state.articles.find(x=>x.code===u.article_code)}));

  const view = state.stockView;
  const codeOrTextFilterMatches = (u,a) => {
    if (state.stockFilterCodes.size>0) return state.stockFilterCodes.has(u.article_code);
    if (!state.stockFilterText.trim()) return true;
    const q = state.stockFilterText.trim().toLowerCase();
    return u.article_code.toLowerCase().includes(q) || (a && a.name.toLowerCase().includes(q));
  };
  if (view === "expiry"){
    if (state.stockFilterFrom) pairs = pairs.filter(p=>p.u.bbd && p.u.bbd>=state.stockFilterFrom);
    if (state.stockFilterTo) pairs = pairs.filter(p=>p.u.bbd && p.u.bbd<=state.stockFilterTo);
    pairs.sort((x,y)=>(x.u.bbd||"9999-99-99").localeCompare(y.u.bbd||"9999-99-99"));
  } else if (view === "month"){
    const fromDate = state.stockFilterFrom || todayISO();
    const toDate = state.stockFilterTo || new Date(Date.now() + 30*86400000).toISOString().slice(0,10);
    pairs = pairs.filter(p=>p.u.bbd && p.u.bbd>=fromDate && p.u.bbd<=toDate);
    pairs.sort((x,y)=>x.u.bbd.localeCompare(y.u.bbd));
  } else if (view === "code"){
    pairs = pairs.filter(p=>codeOrTextFilterMatches(p.u,p.a));
    pairs.sort((x,y)=>naturalCodeSort(x.u.article_code,y.u.article_code) || (x.u.bbd||"").localeCompare(y.u.bbd||""));
  } else if (view === "category"){
    if (state.stockFilterCategories.size>0){
      pairs = pairs.filter(p=>{ const c=classifyArticle(p.u.article_code); return state.stockFilterCategories.has(c.temp+"|"+c.cut); });
    }
    pairs.sort((x,y)=>{
      const cx = classifyArticle(x.u.article_code), cy = classifyArticle(y.u.article_code);
      const kx = CATEGORY_ORDER.findIndex(([t,c])=>t===cx.temp&&c===cx.cut);
      const ky = CATEGORY_ORDER.findIndex(([t,c])=>t===cy.temp&&c===cy.cut);
      const rx = kx<0?999:kx, ry = ky<0?999:ky;
      if (rx!==ry) return rx-ry;
      return (x.a?x.a.name:"").localeCompare(y.a?y.a.name:"", "el");
    });
  } else { // "product" (default)
    pairs = pairs.filter(p=>codeOrTextFilterMatches(p.u,p.a));
    pairs.sort((x,y)=>(x.a?x.a.name:"").localeCompare(y.a?y.a.name:"", "el") || (x.u.bbd||"").localeCompare(y.u.bbd||""));
  }
  return pairs;
}

  return ({product:"Ανά προϊόν", code:"Ανά κωδικό", category:"Ανά κατηγορία", expiry:"Ανά ημ. λήξης", month:"Λήγουν τις επόμενες 30 ημέρες"})[view] || view;
}

// Κατηγοριοποίηση με βάση τον κωδικό είδους:
// 66xxx(x) = Frozen, 65xxx(x) = Fresh
// 5ψήφιος = Grain Fed
// 6ψήφιος λήγοντας σε 3 = Grass Fed, σε 4 = R&L Set, σε 9 = Full Set Grain Fed
function classifyArticle(code){
  const digits = String(code||"").replace(/\D/g,"");
  const len = digits.length;
  const prefix2 = digits.slice(0,2);
  let temp = "Άλλο";
  if (prefix2 === "66") temp = "Frozen";
  else if (prefix2 === "65") temp = "Fresh";
  let cut = "Άλλο";
  if (len === 5) cut = "Grain Fed";
  else if (len === 6){
    const last = digits.slice(-1);
    if (last==="3") cut = "Grass Fed";
    else if (last==="4") cut = "R&L Set";
    else if (last==="9") cut = "Full Set Grain Fed";
  }
  return {temp, cut, label: `${temp} · ${cut}`};
}
const CATEGORY_ORDER = [
  ["Fresh","Grain Fed"], ["Fresh","Grass Fed"], ["Fresh","R&L Set"], ["Fresh","Full Set Grain Fed"], ["Fresh","Άλλο"],
  ["Frozen","Grain Fed"], ["Frozen","Grass Fed"], ["Frozen","R&L Set"], ["Frozen","Full Set Grain Fed"], ["Frozen","Άλλο"],
  ["Άλλο","Άλλο"],
];
function categoryBadges(code){
  const {temp, cut} = classifyArticle(code);
  const tempCls = temp==="Frozen" ? "frost" : temp==="Fresh" ? "fresh" : "";
  return `<span class="badge ${tempCls}">${temp}</span> <span class="badge">${cut}</span>`;
}
function naturalCodeSort(a,b){

// Επιλέγει αυτόματα lots με βάση FEFO (πιο κοντινή λήξη πρώτα) για να καλύψει τη ζητούμενη ποσότητα
// ενός κωδικού, και προσθέτει την κατανομή στο state.cart. Σέβεται ό,τι είναι ήδη στο καλάθι.
// Επιστρέφει {added, requested, fulfilled} για ενημέρωση του χρήστη.
function allocateFEFO(articleCode, requestedBoxes){
  const lots = state.stockUnits
    .filter(u=>u.article_code===articleCode && (u.volume_boxes||0) > 0)
    .sort((a,b)=>(a.bbd||"9999-99-99").localeCompare(b.bbd||"9999-99-99"));
  let remaining = requestedBoxes;
  for (const lot of lots){
    if (remaining <= 0) break;
    const alreadyInCart = state.cart[lot.sscc] || 0;
    const availableHere = lot.volume_boxes - alreadyInCart;
    if (availableHere <= 0) continue;
    const take = Math.min(remaining, availableHere);
    state.cart[lot.sscc] = alreadyInCart + take;
    remaining -= take;
  }
  return { requested: requestedBoxes, fulfilled: requestedBoxes - remaining };
}
function applyQuickOrder(){
  const raw = (document.getElementById("quickOrderText")||{}).value || "";
  state.quickOrderDraft = raw;
  const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
  if (lines.length===0) return showToast("Γράψε τουλάχιστον μία γραμμή κωδικός/ποσότητα");
  let touchedCount = 0;
  const problems = [];
  let lastCode = null;
  lines.forEach(line=>{
    const parts = line.split(/[,;\t]+|\s+/).filter(Boolean);
    if (parts.length < 2){ problems.push(`Αγνοήθηκε (λείπει ποσότητα): "${line}"`); return; }
    const code = parts[0];
    const qty = toNumber(parts[1]);
    if (!qty || qty <= 0){ problems.push(`Μη έγκυρη ποσότητα: "${line}"`); return; }
    const article = state.articles.find(a=>a.code===code);
    if (!article){ problems.push(`Άγνωστος κωδικός: ${code}`); return; }
    const { requested, fulfilled } = allocateFEFO(code, qty);
    if (fulfilled < requested) problems.push(`${article.name}: ζητήθηκαν ${requested}, βρέθηκαν μόνο ${fulfilled} διαθέσιμα κιβώτια`);
    touchedCount++;
    lastCode = code;
  });
  if (lastCode) state.expandedArticle = lastCode;
  if (touchedCount > 0) state.quickOrderDraft = "";
  render();
  if (problems.length > 0) showToast(problems.slice(0,3).join(" · ") + (problems.length>3 ? ` (+${problems.length-3} ακόμα)` : ""));
  else showToast(`Προστέθηκαν ${touchedCount} είδη στο καλάθι με FEFO`);
}

async function submitOrder(){
  if (!state.customerId) return showToast("Επίλεξε πελάτη");
  const cartEntries = Object.entries(state.cart).filter(([,q])=>q>0);
  if (cartEntries.length===0) return showToast("Πρόσθεσε προϊόντα");
  const items = [];
  for (const [sscc, qty] of cartEntries){
    const su = state.stockUnits.find(x=>x.sscc===sscc);
    if (!su) continue;
    if (qty > su.volume_boxes) return showToast(`Ανεπαρκές απόθεμα στο lot ${su.lot_code||sscc}`);
    const a = state.articles.find(x=>x.code===su.article_code);
    const ratio = su.volume_boxes > 0 ? (su.weight_kg / su.volume_boxes) : 0;
    const weight = qty*ratio;
    const pricePerKg = a?.price_per_kg||0;
    items.push({sscc, article_code: su.article_code, article_name: a?.name||su.article_code, lot_code: su.lot_code, bbd: su.bbd, qty, weight, price: a?.price||0, price_per_kg: pricePerKg, value: weight*pricePerKg});
  }
  if (items.length===0) return showToast("Πρόσθεσε προϊόντα");
  const order = {id: uid(), date: todayISO(), customer_id: state.customerId, items, created_at: new Date().toISOString()};
  const {data: insertedRows, error: orderErr} = await sb.from("orders").insert(order).select();
  if (orderErr) return showToast(`Σφάλμα αποθήκευσης παραγγελίας: ${orderErr.message}`);
  const orderNo = insertedRows && insertedRows[0] ? insertedRows[0].order_number : null;
  for (const it of items){
    const su = state.stockUnits.find(x=>x.sscc===it.sscc);
    const newBoxes = Math.max(0, su.volume_boxes - it.qty);
    const newWeight = Math.max(0, su.weight_kg - it.weight);
    await sb.from("stock_units").update({volume_boxes:newBoxes, weight_kg:newWeight}).eq("sscc", it.sscc);
  }
  state.cart = {};
  showToast(orderNo ? `Η παραγγελία ${orderNo} καταχωρήθηκε` : "Η παραγγελία καταχωρήθηκε");
  await loadAll();
}

async function deleteOrderAndRestore(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if (!order) return;
  let restoredCount = 0, missingCount = 0;
  for (const it of (order.items||[])){
    if (!it.sscc) { missingCount++; continue; }
    const su = state.stockUnits.find(x=>x.sscc===it.sscc);
    if (!su) { missingCount++; continue; }
    const newBoxes = su.volume_boxes + (it.qty||0);
    const newWeight = su.weight_kg + (it.weight||0);
    const {error} = await sb.from("stock_units").update({volume_boxes:newBoxes, weight_kg:newWeight}).eq("sscc", it.sscc);
    if (!error) restoredCount++;
  }
  const {error: delErr} = await sb.from("orders").update({deleted_at: new Date().toISOString()}).eq("id", orderId);
  if (delErr) return showToast(`Σφάλμα διαγραφής: ${delErr.message}`);
  await loadAll();
  if (missingCount>0) showToast(`Η παραγγελία διαγράφηκε. ${missingCount} lot(s) δεν βρέθηκαν — δεν επαναφέρθηκε το απόθεμά τους.`);
  else showToast("Η παραγγελία διαγράφηκε και το απόθεμα επαναφέρθηκε");
}

function renderStock(){
  const totalBoxes = state.stockUnits.reduce((s,u)=>s+(Number(u.volume_boxes)||0),0);
  const totalWeight = state.stockUnits.reduce((s,u)=>s+(Number(u.weight_kg)||0),0);
  const totalValue = state.articles.reduce((s,a)=>{ const {weight} = articleTotals(a.code); return s + weight*(a.price_per_kg||0); },0);
  const expiring = state.stockUnits.filter(u=>u.bbd && daysUntil(u.bbd) <= EXPIRY_WARNING_DAYS && (u.volume_boxes>0||u.weight_kg>0))
    .sort((a,b)=>a.bbd.localeCompare(b.bbd));

  const viewOptions = [
    ["product","Ανά προϊόν"],
    ["code","Ανά κωδικό"],
    ["category","Ανά κατηγορία"],
    ["expiry","Ανά ημ. λήξης"],
    ["month","Λήγουν τις επόμενες 30 ημέρες"],
  ];

  const subtotalOf = (arts) => arts.reduce((acc,a)=>{
    const {boxes, weight} = articleTotals(a.code);
    acc.boxes += boxes; acc.weight += weight; acc.value += weight*(a.price_per_kg||0);
    return acc;
  }, {boxes:0, weight:0, value:0});
  const subtotalOfLots = (lots) => lots.reduce((acc,l)=>{
    const a = state.articles.find(x=>x.code===l.article_code);
    acc.boxes += Number(l.volume_boxes)||0; acc.weight += Number(l.weight_kg)||0;
    acc.value += (Number(l.weight_kg)||0)*(a?.price_per_kg||0);
    return acc;
  }, {boxes:0, weight:0, value:0});

  let listHTML = "";
  let visibleCodes = []; // for expand-all/collapse-all scoping
  let sub = {boxes:0, weight:0, value:0};
  let filterBarHTML = "";

  if (state.stockView === "product" || state.stockView === "code"){
    const q = state.stockFilterText.trim().toLowerCase();
    const chipCandidates = state.articles
      .filter(a=>!q || a.code.toLowerCase().includes(q) || a.name.toLowerCase().includes(q))
      .sort((a,b)=> state.stockView==="product" ? a.name.localeCompare(b.name,'el') : naturalCodeSort(a.code,b.code));
    filterBarHTML = `
      <input id="stockFilterText" placeholder="Αναζήτηση για να βρεις κωδικούς..." value="${esc(state.stockFilterText)}" />
      <div class="row" style="margin:8px 0 6px;">
        <span class="muted" style="font-size:11px;">${state.stockFilterCodes.size>0 ? `${state.stockFilterCodes.size} επιλεγμένα είδη` : "Κανένα επιλεγμένο — δείχνει όλα"}</span>
        <div style="display:flex;gap:10px;">
          ${chipCandidates.length>0?`<button class="btn link" id="selectAllCodeChipsBtn" style="padding:0;">Επιλογή όλων</button>`:""}
          ${state.stockFilterCodes.size>0 ? `<button class="btn link" id="clearCodeFilterBtn" style="padding:0;">Καθαρισμός</button>` : ""}
        </div>
      </div>
      <div class="chipwrap">
        ${chipCandidates.length===0 ? `<span class="muted2" style="font-size:12px;">Κανένα αποτέλεσμα.</span>` :
          chipCandidates.map(a=>`<button type="button" class="chip ${state.stockFilterCodes.has(a.code)?'active':''}" data-codechip="${esc(a.code)}">${esc(a.code)} · ${esc(a.name)}</button>`).join("")}
      </div>`;
    let sorted = state.stockFilterCodes.size>0
      ? state.articles.filter(a=>state.stockFilterCodes.has(a.code))
      : state.articles.filter(a=>!q || a.code.toLowerCase().includes(q) || a.name.toLowerCase().includes(q));
    sorted = state.stockView==="product"
      ? sorted.sort((a,b)=>a.name.localeCompare(b.name,'el'))
      : sorted.sort((a,b)=>naturalCodeSort(a.code,b.code));
    visibleCodes = sorted.map(a=>a.code);
    sub = subtotalOf(sorted);
    listHTML = sorted.length===0 ? `<p class="center-note">Κανένα αποτέλεσμα.</p>` : sorted.map(articleCardHTML).join("");
  }
  else if (state.stockView === "category"){
    const allGroups = {};
    state.articles.forEach(a=>{
      const {temp, cut} = classifyArticle(a.code);
      const key = temp+"|"+cut;
      if (!allGroups[key]) allGroups[key] = [];
      allGroups[key].push(a);
    });
    const allKeysOrdered = CATEGORY_ORDER.map(([t,c])=>t+"|"+c).filter(k=>allGroups[k]);
    Object.keys(allGroups).forEach(k=>{ if (!allKeysOrdered.includes(k)) allKeysOrdered.push(k); });
    filterBarHTML = `
      <div class="chipwrap">
        ${allKeysOrdered.map(key=>{
          const [t,c] = key.split("|");
          return `<button type="button" class="chip ${state.stockFilterCategories.has(key)?'active':''}" data-catchip="${key}">${t} · ${c}</button>`;
        }).join("")}
      </div>
      ${state.stockFilterCategories.size>0 ? `<button class="btn link" id="clearCategoryFilterBtn" style="padding:0;margin-top:6px;">Καθαρισμός επιλογής</button>` : ""}
    `;
    const activeKeys = state.stockFilterCategories.size>0 ? allKeysOrdered.filter(k=>state.stockFilterCategories.has(k)) : allKeysOrdered;
    const groups = {}; activeKeys.forEach(k=>groups[k]=allGroups[k]||[]);
    visibleCodes = Object.values(groups).flat().map(a=>a.code);
    sub = subtotalOf(Object.values(groups).flat());
    listHTML = visibleCodes.length===0 ? `<p class="center-note">Δεν υπάρχουν είδη σε αυτές τις κατηγορίες.</p>` : activeKeys.map(key=>{
      const [temp, cut] = key.split("|");
      const arts = (groups[key]||[]).sort((a,b)=>a.name.localeCompare(b.name,'el'));
      if (arts.length===0) return "";
      const groupBoxes = arts.reduce((s,a)=>s+articleTotals(a.code).boxes,0);
      const groupWeight = arts.reduce((s,a)=>s+articleTotals(a.code).weight,0);
      const tempCls = temp==="Frozen" ? "frost" : temp==="Fresh" ? "fresh" : "";
      return `
        <div style="margin-bottom:14px;">
          <div class="row" style="margin-bottom:6px;">
            <span class="muted" style="text-transform:uppercase;letter-spacing:0.5px;"><span class="badge ${tempCls}">${temp}</span> <span class="badge">${cut}</span></span>
            <span class="muted2" style="font-size:11px;">${groupBoxes} κιβ. · ${groupWeight.toFixed(1)} κιλά</span>
          </div>
          <div class="stack" style="gap:6px;">
            ${arts.map(articleCardHTML).join("")}
          </div>
        </div>`;
    }).join("");
  }
  else if (state.stockView === "expiry"){
    filterBarHTML = `
      <div class="row" style="gap:8px;flex-wrap:wrap;">
        <div><label>Από</label><input type="date" id="stockFilterFrom" value="${state.stockFilterFrom||""}" style="width:auto;" /></div>
        <div><label>Έως</label><input type="date" id="stockFilterTo" value="${state.stockFilterTo||""}" style="width:auto;" /></div>
      </div>`;
    let lotsWithStock = state.stockUnits.filter(u=>(u.volume_boxes>0||u.weight_kg>0));
    if (state.stockFilterFrom) lotsWithStock = lotsWithStock.filter(u=>u.bbd && u.bbd>=state.stockFilterFrom);
    if (state.stockFilterTo) lotsWithStock = lotsWithStock.filter(u=>u.bbd && u.bbd<=state.stockFilterTo);
    lotsWithStock = lotsWithStock.sort((a,b)=>(a.bbd||"9999-99-99").localeCompare(b.bbd||"9999-99-99"));
    sub = subtotalOfLots(lotsWithStock);
    listHTML = lotsWithStock.length===0 ? `<p class="center-note">Δεν υπάρχει διαθέσιμο απόθεμα.</p>` : lotsWithStock.map(l=>{
      const a = state.articles.find(x=>x.code===l.article_code);
      const days = l.bbd ? daysUntil(l.bbd) : null;
      const cls = days===null ? "" : days<0 ? "expired" : days<=EXPIRY_WARNING_DAYS ? "expiring" : "";
      return `
        <div class="card ${cls} row">
          <div>
            <div style="font-size:13px;">${esc(a?a.name:l.article_code)} <span class="muted2">${esc(l.article_code)}</span></div>
            <div class="muted">Lot ${esc(l.lot_code||"—")} · ${zoneBadge(l.zone)} ${l.volume_boxes} κιβ. · ${Number(l.weight_kg).toFixed(1)} κιλά</div>
          </div>
          ${bbdBadge(l.bbd)}
        </div>`;
    }).join("");
  }
  else if (state.stockView === "month"){
    const defaultFrom = todayISO();
    const defaultTo = new Date(Date.now() + 30*86400000).toISOString().slice(0,10);
    filterBarHTML = `
      <div class="row" style="gap:8px;flex-wrap:wrap;">
        <div><label>Από</label><input type="date" id="stockFilterFrom" value="${state.stockFilterFrom||defaultFrom}" style="width:auto;" /></div>
        <div><label>Έως</label><input type="date" id="stockFilterTo" value="${state.stockFilterTo||defaultTo}" style="width:auto;" /></div>
      </div>`;
    const fromDate = state.stockFilterFrom || defaultFrom;
    const toDate = state.stockFilterTo || defaultTo;
    const lotsThisMonth = state.stockUnits.filter(u=>u.bbd && u.bbd>=fromDate && u.bbd<=toDate && (u.volume_boxes>0||u.weight_kg>0))
      .sort((a,b)=>a.bbd.localeCompare(b.bbd));
    sub = subtotalOfLots(lotsThisMonth);
    listHTML = lotsThisMonth.length===0 ? `<p class="center-note">Καμία παρτίδα δεν λήγει σε αυτό το διάστημα.</p>` : lotsThisMonth.map(l=>{
      const a = state.articles.find(x=>x.code===l.article_code);
      const days = daysUntil(l.bbd);
      const cls = days<0 ? "expired" : days<=EXPIRY_WARNING_DAYS ? "expiring" : "";
      return `
        <div class="card ${cls} row">
          <div>
            <div style="font-size:13px;">${esc(a?a.name:l.article_code)} <span class="muted2">${esc(l.article_code)}</span></div>
            <div class="muted">Lot ${esc(l.lot_code||"—")} · ${zoneBadge(l.zone)} ${l.volume_boxes} κιβ. · ${Number(l.weight_kg).toFixed(1)} κιλά</div>
          </div>
          ${bbdBadge(l.bbd)}
        </div>`;
    }).join("");
  }

  const showExpandControls = ["product","code","category"].includes(state.stockView);

  return `
    <div class="stack">
      <div class="row" style="justify-content:flex-end;gap:6px;">
        <button class="btn" id="exportStockBtn">⇩ CSV</button>
        <button class="btn" id="exportStockPdfBtn">⇩ PDF</button>
      </div>
      <div class="grid2">
        <div class="stat"><div class="muted">Σύνολο κιβωτίων</div><div class="v">${totalBoxes}</div></div>
        <div class="stat"><div class="muted">Σύνολο κιλών</div><div class="v">${totalWeight.toFixed(1)}</div></div>
      </div>
      <div class="stat accent-amber"><div class="muted">Αξία αποθέματος</div><div class="v">${formatEUR(totalValue)}</div></div>

      ${expiring.length>0 ? `
        <div>
          <p class="muted" style="text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">⚠ Λήγουν σύντομα (εντός ${EXPIRY_WARNING_DAYS} ημερών) ή έληξαν</p>
          <div class="stack" style="gap:6px;">
            ${expiring.map(u=>{
              const a = state.articles.find(x=>x.code===u.article_code);
              const cls = daysUntil(u.bbd) < 0 ? "expired" : "expiring";
              return `<div class="card ${cls} row">
                <div>
                  <div style="font-size:13px;">${esc(a?a.name:u.article_code)} — lot ${esc(u.lot_code||"—")}</div>
                  <div class="muted">${u.volume_boxes} κιβ. · ${Number(u.weight_kg).toFixed(1)} κιλά</div>
                </div>
                ${bbdBadge(u.bbd)}
              </div>`;
            }).join("")}
          </div>
        </div>` : ""}

      <div>
        <div class="row" style="margin-bottom:8px;">
          <p class="muted" style="text-transform:uppercase;letter-spacing:0.5px;margin:0;">Απόθεμα</p>
          ${showExpandControls ? `
            <div style="display:flex;gap:6px;">
              <button class="btn link" id="expandAllStockBtn" data-codes="${visibleCodes.join(',')}">Expand all</button>
              <button class="btn link" id="collapseAllStockBtn">Collapse all</button>
            </div>
          ` : ""}
        </div>
        <div class="tabs2">
          ${viewOptions.map(([id,label])=>`<button data-stockview="${id}" class="${state.stockView===id?'active':''}">${label}</button>`).join("")}
        </div>
        ${filterBarHTML ? `<div style="margin-bottom:10px;">${filterBarHTML}</div>` : ""}
        <div class="grid2" style="margin-bottom:10px;">
          <div class="stat"><div class="muted">Υποσύνολο (κιβώτια / κιλά)</div><div class="v" style="font-size:18px;">${sub.boxes} · ${sub.weight.toFixed(1)}</div></div>
          <div class="stat accent-amber"><div class="muted">Υποσύνολο κόστους</div><div class="v" style="font-size:18px;">${formatEUR(sub.value)}</div></div>
        </div>
        <div class="stack" style="gap:6px;">
          ${listHTML}
        </div>
      </div>
    </div>
  `;
}

/* ---------------- DASHBOARD TAB ---------------- */
function renderDashboard(){
  const today = todayISO();
  const monthPrefix = today.slice(0,7); // YYYY-MM
  const d7start = new Date(Date.now() - 6*86400000).toISOString().slice(0,10);

  const ordersToday = state.orders.filter(o=>o.date===today);
  const orders7d = state.orders.filter(o=>o.date>=d7start);
  const ordersMonth = state.orders.filter(o=>o.date.startsWith(monthPrefix));
  const revenueMonth = ordersMonth.reduce((s,o)=>s+orderTotal(o),0);
  const activeCustomersMonth = new Set(ordersMonth.map(o=>o.customer_id)).size;
  const lowStockCount = state.articles.filter(a=>articleTotals(a.code).boxes<=5).length;
  const expiringCount = state.stockUnits.filter(u=>u.bbd && daysUntil(u.bbd)<=EXPIRY_WARNING_DAYS && (u.volume_boxes>0||u.weight_kg>0)).length;

  // last 14 days order counts
  const days = [];
  for (let i=13;i>=0;i--){
    const d = new Date(Date.now() - i*86400000).toISOString().slice(0,10);
    days.push({date:d, count: state.orders.filter(o=>o.date===d).length});
  }
  const maxCount = Math.max(1, ...days.map(d=>d.count));

  const customerRows = computeCustomerStats();

  const articleRows = computeArticleStats();

  return `
    <div class="stack">
      <div class="grid2">
        <div class="stat accent-amber"><div class="muted">Παραγγελίες σήμερα</div><div class="v">${ordersToday.length}</div></div>
        <div class="stat"><div class="muted">Παραγγελίες (7 ημ.)</div><div class="v">${orders7d.length}</div></div>
        <div class="stat accent-amber"><div class="muted">Έσοδα μήνα</div><div class="v">${formatEUR(revenueMonth, 0)}</div></div>
        <div class="stat"><div class="muted">Ενεργοί πελάτες (μήνα)</div><div class="v">${activeCustomersMonth}</div></div>
        <div class="stat ${lowStockCount>0?'accent-red':''}"><div class="muted">Χαμηλό απόθεμα</div><div class="v">${lowStockCount}</div></div>
        <div class="stat ${expiringCount>0?'accent-frost':''}"><div class="muted">Λήγουν σύντομα</div><div class="v">${expiringCount}</div></div>
      </div>

      <div>
        <p class="muted" style="text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Παραγγελίες τελευταίες 14 ημέρες</p>
        <div class="card">
          <div class="stack" style="gap:5px;">
            ${days.map(d=>`
              <div class="row" style="gap:8px;">
                <span class="muted2" style="width:70px;flex-shrink:0;font-size:11px;">${formatDateEL(d.date).slice(0,5)}</span>
                <div style="flex:1;background:var(--panel2);border-radius:4px;height:14px;overflow:hidden;">
                  <div style="width:${(d.count/maxCount*100).toFixed(0)}%;background:var(--brand);height:100%;border-radius:4px;min-width:${d.count>0?'4px':'0'};"></div>
                </div>
                <span class="muted" style="width:18px;text-align:right;flex-shrink:0;">${d.count}</span>
              </div>
            `).join("")}
          </div>
        </div>
      </div>

      <div>
        <div class="row" style="margin-bottom:8px;">
          <p class="muted" style="text-transform:uppercase;letter-spacing:0.5px;margin:0;">Ποσότητες ανά πελάτη</p>
          <div style="display:flex;gap:6px;">
            <button class="btn" id="exportCustomerStatsCsvBtn">⇩ CSV</button>
            <button class="btn" id="exportCustomerStatsPdfBtn">⇩ PDF</button>
          </div>
        </div>
        <div class="stack" style="gap:6px;">
          ${customerRows.length===0?`<p class="center-note">Δεν υπάρχουν παραγγελίες ακόμα.</p>`:""}
          ${customerRows.map(c=>{
            const expanded = state.expandedDashCustomers.has(c.id);
            const articleBreakdown = Object.values(c.byArticle).sort((x,y)=>y.boxes-x.boxes);
            return `
            <div class="card">
              <div class="row" style="cursor:pointer;" data-toggledashcust="${c.id}">
                <div>
                  <div style="font-size:13px;">${esc(c.name)} <span class="muted2">${expanded?"▲":"▼"}</span></div>
                  <div class="muted">${c.orders} παραγγελ. · ${c.boxes} κιβ. · ${c.weight.toFixed(1)} κιλά</div>
                </div>
                ${c.value>0?`<span style="font-weight:600;color:var(--brand-bright);font-family:var(--font-display);">${formatEUR(c.value)}</span>`:""}
              </div>
              ${expanded ? `
                <div class="lotrow">
                  <div class="stack" style="gap:5px;">
                    ${articleBreakdown.map(a=>`
                      <div class="row" style="font-size:12px;">
                        <span class="muted">${esc(a.name)}</span>
                        <span class="muted2">${a.boxes} κιβ. · ${a.weight.toFixed(1)} κιλά${a.value>0?` · ${formatEUR(a.value)}`:""}</span>
                      </div>
                    `).join("")}
                  </div>
                </div>
              ` : ""}
            </div>
          `;}).join("")}
        </div>
      </div>

      <div>
        <div class="row" style="margin-bottom:8px;">
          <p class="muted" style="text-transform:uppercase;letter-spacing:0.5px;margin:0;">Ποσότητες ανά κωδικό είδους</p>
          <div style="display:flex;gap:6px;">
            <button class="btn" id="exportArticleStatsCsvBtn">⇩ CSV</button>
            <button class="btn" id="exportArticleStatsPdfBtn">⇩ PDF</button>
          </div>
        </div>
        <div class="stack" style="gap:6px;">
          ${articleRows.length===0?`<p class="center-note">Δεν υπάρχουν παραγγελίες ακόμα.</p>`:""}
          ${articleRows.map(a=>`
            <div class="card row">
              <div>
                <div style="font-size:13px;">${esc(a.name)}</div>
                <div class="muted">${a.boxes} κιβ. · ${a.weight.toFixed(1)} κιλά</div>
              </div>
              ${a.value>0?`<span style="font-weight:600;color:var(--brand-bright);font-family:var(--font-display);">${formatEUR(a.value)}</span>`:""}
            </div>
          `).join("")}
        </div>
      </div>
    </div>
  `;
}

/* ---------------- events ---------------- */
function bindEvents(){
  root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
    state.tab=b.dataset.tab; state.search=""; state.editingArticle=null; state.editingCustomer=null;
    state.showImportStock=false; state.showImportC=false; state.addingLotFor=null; state.selectedOrders.clear();
    render();
    if (state.tab === "trash") loadTrash();
  });

  root.querySelectorAll("[data-togglequickorder]").forEach(el=>el.onclick=()=>{
    state.showQuickOrder = !state.showQuickOrder;
    render();
  });
  const applyQuickOrderBtn = document.getElementById("applyQuickOrderBtn");
  if (applyQuickOrderBtn) applyQuickOrderBtn.onclick = applyQuickOrder;
  const quickOrderText = document.getElementById("quickOrderText");
  if (quickOrderText) quickOrderText.oninput = e => { state.quickOrderDraft = e.target.value; };
  root.querySelectorAll("[data-togglearticle]").forEach(el=>el.onclick=()=>{
    const code = el.dataset.togglearticle;
    state.expandedArticle = state.expandedArticle === code ? null : code;
    state.addingLotFor = null;
    render();
  });
  root.querySelectorAll("[data-togglestockarticle]").forEach(el=>el.onclick=()=>{
    const code = el.dataset.togglestockarticle;
    if (state.stockExpanded.has(code)) state.stockExpanded.delete(code);
    else state.stockExpanded.add(code);
    render();
  });
  root.querySelectorAll("[data-toggledashcust]").forEach(el=>el.onclick=()=>{
    const id = el.dataset.toggledashcust;
    if (state.expandedDashCustomers.has(id)) state.expandedDashCustomers.delete(id);
    else state.expandedDashCustomers.add(id);
    render();
  });
  const exportCustomerStatsCsvBtn = document.getElementById("exportCustomerStatsCsvBtn");
  if (exportCustomerStatsCsvBtn) exportCustomerStatsCsvBtn.onclick = exportCustomerStatsCSV;
  const exportCustomerStatsPdfBtn = document.getElementById("exportCustomerStatsPdfBtn");
  if (exportCustomerStatsPdfBtn) exportCustomerStatsPdfBtn.onclick = exportCustomerStatsPDF;
  const exportArticleStatsCsvBtn = document.getElementById("exportArticleStatsCsvBtn");
  if (exportArticleStatsCsvBtn) exportArticleStatsCsvBtn.onclick = exportArticleStatsCSV;
  const exportArticleStatsPdfBtn = document.getElementById("exportArticleStatsPdfBtn");
  if (exportArticleStatsPdfBtn) exportArticleStatsPdfBtn.onclick = exportArticleStatsPDF;
  const expandAllStockBtn = document.getElementById("expandAllStockBtn");
  if (expandAllStockBtn) expandAllStockBtn.onclick = () => {
    const codes = (expandAllStockBtn.dataset.codes||"").split(",").filter(Boolean);
    codes.forEach(c=>state.stockExpanded.add(c));
    render();
  };
  const collapseAllStockBtn = document.getElementById("collapseAllStockBtn");
  if (collapseAllStockBtn) collapseAllStockBtn.onclick = () => { state.stockExpanded.clear(); render(); };
  root.querySelectorAll("[data-togglecustomer]").forEach(el=>el.onclick=()=>{
    const id = el.dataset.togglecustomer;
    state.expandedCustomer = state.expandedCustomer === id ? null : id;
    render();
  });
  root.querySelectorAll("[data-viewcustomer]").forEach(el=>el.onclick=()=>{
    state.viewingCustomerId = el.dataset.viewcustomer;
    render();
  });
  root.querySelectorAll("[data-backtocustomers]").forEach(el=>el.onclick=()=>{
    state.viewingCustomerId = null;
    state.editingCustomer = null;
    render();
  });
  root.querySelectorAll("[data-gotohistorycustomer]").forEach(el=>el.onclick=()=>{
    state.tab = "history";
    state.historyView = "customer";
    state.historyCustomer = el.dataset.gotohistorycustomer;
    state.viewingCustomerId = null;
    render();
  });

  const custSel = document.getElementById("customerSelect");
  if (custSel) custSel.onchange = e => { state.customerId = e.target.value; };
  const searchInput = document.getElementById("searchInput");
  if (searchInput) searchInput.oninput = e => {
    state.search = e.target.value; render();
    const el = document.getElementById("searchInput");
    if (el){ el.focus(); el.selectionStart = el.value.length; }
  };

  root.querySelectorAll("[data-lotqtyup]").forEach(b=>b.onclick=()=>{
    const s=b.dataset.lotqtyup, max=Number(b.dataset.max)||Infinity;
    state.cart[s]=Math.min(max,(state.cart[s]||0)+1); render();
  });
  root.querySelectorAll("[data-lotqtydown]").forEach(b=>b.onclick=()=>{
    const s=b.dataset.lotqtydown; state.cart[s]=Math.max(0,(state.cart[s]||0)-1); render();
  });
  root.querySelectorAll("[data-lotqtyinput]").forEach(inp=>inp.onchange=()=>{
    const s=inp.dataset.lotqtyinput, max=Number(inp.dataset.max)||Infinity;
    state.cart[s]=Math.max(0,Math.min(max,Number(inp.value)||0)); render();
  });
  const submitBtn = document.getElementById("submitOrderBtn");
  if (submitBtn) submitBtn.onclick = submitOrder;

  // articles tab
  const addArticleBtn = document.getElementById("addArticleBtn");
  if (addArticleBtn) addArticleBtn.onclick = () => { state.editingArticle = {code:"",name:"",price:0,price_per_kg:0,custom:{},isNew:true}; render(); };
  const toggleImportStock = document.getElementById("toggleImportStock");
  if (toggleImportStock) toggleImportStock.onclick = () => { state.showImportStock = !state.showImportStock; render(); };
  root.querySelectorAll("[data-editarticle]").forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    const a = state.articles.find(x=>x.code===b.dataset.editarticle);
    state.editingArticle = {...a, custom: a.custom||{}, _origCode: a.code};
    render();
  });
  root.querySelectorAll("[data-delarticle]").forEach(b=>b.onclick=async(ev)=>{
    ev.stopPropagation();
    if (!confirm("Μεταφορά είδους και όλων των παρτίδων του στον Κάδο; Μπορείς να το επαναφέρεις αργότερα.")) return;
    const code = b.dataset.delarticle;
    const ts = new Date().toISOString();
    await sb.from("articles").update({deleted_at: ts}).eq("code", code);
    await sb.from("stock_units").update({deleted_at: ts}).eq("article_code", code).is("deleted_at", null);
    await loadAll();
  });
  root.querySelectorAll("[data-dellot]").forEach(b=>b.onclick=async()=>{
    await sb.from("stock_units").update({deleted_at: new Date().toISOString()}).eq("sscc", b.dataset.dellot);
    await loadAll();
  });
  root.querySelectorAll("[data-addlot]").forEach(b=>b.onclick=()=>{ state.addingLotFor = b.dataset.addlot; render(); });
  const cancelLotBtn = document.getElementById("cancelLotBtn");
  if (cancelLotBtn) cancelLotBtn.onclick = () => { state.addingLotFor = null; render(); };
  const saveLotBtn = document.getElementById("saveLotBtn");
  if (saveLotBtn) saveLotBtn.onclick = async () => {
    const articleCode = saveLotBtn.dataset.article;
    const rec = {
      sscc: document.getElementById("l_sscc").value.trim() || uid(),
      article_code: articleCode,
      zone: document.getElementById("l_zone").value.trim(),

      weight_kg: toNumber(document.getElementById("l_weight").value),
      lot_code: document.getElementById("l_lot").value.trim(),

      reference: document.getElementById("l_reference").value.trim(),
    };
    const {error} = await sb.from("stock_units").upsert(rec, {onConflict:"sscc"});

    state.addingLotFor = null;
    await loadAll();
    showToast("Η παρτίδα αποθηκεύτηκε");
  };

  const cancelArticleBtn = document.getElementById("cancelArticleBtn");
  if (cancelArticleBtn) cancelArticleBtn.onclick = () => { state.editingArticle = null; render(); };
  const addCustomFieldBtn = document.getElementById("addCustomFieldBtn");
  if (addCustomFieldBtn) addCustomFieldBtn.onclick = () => {
    collectArticleForm();
    state.editingArticle.custom[""] = "";
    render();
  };
  root.querySelectorAll("[data-removecf]").forEach((b,idx)=>b.onclick=()=>{
    collectArticleForm();
    const keys = Object.keys(state.editingArticle.custom);
    delete state.editingArticle.custom[keys[idx]];
    render();
  });
  const saveArticleBtn = document.getElementById("saveArticleBtn");
  if (saveArticleBtn) saveArticleBtn.onclick = saveArticle;

  // customers tab
  const addCustomerBtn = document.getElementById("addCustomerBtn");
  if (addCustomerBtn) addCustomerBtn.onclick = () => { state.editingCustomer = {id: uid(), name:"", code:"",vat:"",commercial_name:"",address:"",area:"",zip:"",city:"",country:"",phone:"",fax:"",email:"",email2:"",notes:"", delivery_same_as_billing:true, delivery_address:"",delivery_area:"",delivery_zip:"",delivery_city:"",delivery_country:"", isNew:true}; render(); };
  const toggleImportC = document.getElementById("toggleImportC");
  if (toggleImportC) toggleImportC.onclick = () => { state.showImportC = !state.showImportC; render(); };
  root.querySelectorAll("[data-editcustomer]").forEach(b=>b.onclick=()=>{
    state.editingCustomer = {...state.customers.find(c=>c.id===b.dataset.editcustomer)};
    render();
  });
  root.querySelectorAll("[data-delcustomer]").forEach(b=>b.onclick=async()=>{
    if (!confirm("Μεταφορά πελάτη στον Κάδο; Μπορείς να τον επαναφέρεις αργότερα.")) return;
    await sb.from("customers").update({deleted_at: new Date().toISOString()}).eq("id", b.dataset.delcustomer);
    await loadAll();
  });

  if (cancelCustomerBtn) cancelCustomerBtn.onclick = () => { state.editingCustomer = null; render(); };
  const saveCustomerBtn = document.getElementById("saveCustomerBtn");
  if (saveCustomerBtn) saveCustomerBtn.onclick = saveCustomer;
  const deliverySameCheckbox = document.getElementById("c_delivery_same");
  if (deliverySameCheckbox) deliverySameCheckbox.onchange = () => {

  };

  // stock import
  const importFile = document.getElementById("importFile");
  if (importFile) importFile.onchange = async () => {
    const file = importFile.files[0];
    if (!file) return;
    try {
      document.getElementById("importText").value = await readFileSmart(file);
    } catch (e) {

  if (doImportStockBtn) doImportStockBtn.onclick = doImportStock;
  const cancelImportStockBtn = document.getElementById("cancelImportStockBtn");
  if (cancelImportStockBtn) cancelImportStockBtn.onclick = () => { state.showImportStock=false; render(); };
  const clearStockBtn = document.getElementById("clearStockBtn");
  if (clearStockBtn) clearStockBtn.onclick = async () => {
    if (!confirm("Θα διαγραφούν ΟΛΕΣ οι παρτίδες stock (τα είδη/τιμές παραμένουν). Συνέχεια;")) return;
    const {error} = await sb.from("stock_units").delete().neq("sscc","");
    if (error) return showToast(`Σφάλμα: ${error.message}`);
    await loadAll();
    showToast("Το stock καθαρίστηκε");
  };
  const doImportCBtn = document.getElementById("doImportCBtn");
  if (doImportCBtn) doImportCBtn.onclick = doImportCustomers;
  const cancelImportCBtn = document.getElementById("cancelImportCBtn");
  if (cancelImportCBtn) cancelImportCBtn.onclick = () => { state.showImportC=false; render(); };
  const exportCustomersBtn = document.getElementById("exportCustomersBtn");
  if (exportCustomersBtn) exportCustomersBtn.onclick = exportCustomersCSV;

  // history tab
  root.querySelectorAll("[data-hview]").forEach(b=>b.onclick=()=>{ state.historyView=b.dataset.hview; state.selectedOrders.clear(); render(); });
  root.querySelectorAll("[data-datemode]").forEach(b=>b.onclick=()=>{
    state.historyDateMode = b.dataset.datemode;
    if (state.historyDateMode === "range" && !state.historyRange){
      const from = new Date(Date.now() - 6*86400000).toISOString().slice(0,10);
      state.historyRange = { from, to: state.historyDate };
    }
    if (state.historyDateMode === "single") state.historyRange = null;
    state.selectedOrders.clear();
    render();
  });
  const historyRangeFrom = document.getElementById("historyRangeFrom");
  const historyRangeTo = document.getElementById("historyRangeTo");
  if (historyRangeFrom) historyRangeFrom.onchange = e => {
    state.historyRange = { from: e.target.value, to: (historyRangeTo?historyRangeTo.value:state.historyRange.to) };
    state.selectedOrders.clear(); render();
  };
  if (historyRangeTo) historyRangeTo.onchange = e => {
    state.historyRange = { from: (historyRangeFrom?historyRangeFrom.value:state.historyRange.from), to: e.target.value };
    state.selectedOrders.clear(); render();
  };
  root.querySelectorAll("[data-stockview]").forEach(b=>b.onclick=()=>{
    state.stockView=b.dataset.stockview;
    state.stockFilterText=""; state.stockFilterCodes=new Set(); state.stockFilterCategories=new Set();
    state.stockFilterFrom=""; state.stockFilterTo="";
    render();
  });
  const stockFilterText = document.getElementById("stockFilterText");
  if (stockFilterText) stockFilterText.oninput = e => {
    state.stockFilterText = e.target.value; render();

  root.querySelectorAll("[data-codechip]").forEach(chip=>chip.onclick=()=>{
    const code = chip.dataset.codechip;
    if (state.stockFilterCodes.has(code)) state.stockFilterCodes.delete(code);
    else state.stockFilterCodes.add(code);

  });
  const selectAllCodeChipsBtn = document.getElementById("selectAllCodeChipsBtn");
  if (selectAllCodeChipsBtn) selectAllCodeChipsBtn.onclick = () => {

    render();
  };
  const clearCodeFilterBtn = document.getElementById("clearCodeFilterBtn");
  if (clearCodeFilterBtn) clearCodeFilterBtn.onclick = () => { state.stockFilterCodes = new Set(); render(); };
  root.querySelectorAll("[data-catchip]").forEach(chip=>chip.onclick=()=>{
    const key = chip.dataset.catchip;
    if (state.stockFilterCategories.has(key)) state.stockFilterCategories.delete(key);
    else state.stockFilterCategories.add(key);
    render();
  });
  const clearCategoryFilterBtn = document.getElementById("clearCategoryFilterBtn");
  if (clearCategoryFilterBtn) clearCategoryFilterBtn.onclick = () => { state.stockFilterCategories = new Set(); render(); };
  const stockFilterFrom = document.getElementById("stockFilterFrom");
  if (stockFilterFrom) stockFilterFrom.onchange = e => { state.stockFilterFrom = e.target.value; render(); };
  const stockFilterTo = document.getElementById("stockFilterTo");
  if (stockFilterTo) stockFilterTo.onchange = e => { state.stockFilterTo = e.target.value; render(); };
  const historyDateInput = document.getElementById("historyDateInput");
  if (historyDateInput) historyDateInput.onchange = e => { state.historyDate = e.target.value; state.selectedOrders.clear(); render(); };
  const historyCustomerSelect = document.getElementById("historyCustomerSelect");
  if (historyCustomerSelect) historyCustomerSelect.onchange = e => { state.historyCustomer = e.target.value; state.selectedOrders.clear(); render(); };
  root.querySelectorAll("[data-delorder]").forEach(b=>b.onclick=async()=>{
    if (!confirm("Μεταφορά παραγγελίας στον Κάδο; Το απόθεμα θα επιστραφεί στα αντίστοιχα lots, και μπορείς να την επαναφέρεις αργότερα.")) return;
    state.selectedOrders.delete(b.dataset.delorder);
    await deleteOrderAndRestore(b.dataset.delorder);
  });
  root.querySelectorAll("[data-orderstatus]").forEach(sel=>sel.onchange=async()=>{
    const id = sel.dataset.orderstatus;
    const newStatus = sel.value;
    const order = state.orders.find(o=>o.id===id);
    if (order) order.status = newStatus; // αισιόδοξη ενημέρωση, χωρίς πλήρες reload
    const {error} = await sb.from("orders").update({status: newStatus || null}).eq("id", id);
    if (error) showToast(`Σφάλμα: ${error.message}`);
    else showToast(`Κατάσταση: ${statusLabel(newStatus)}`);
  });
  root.querySelectorAll("[data-deliveryslip]").forEach(b=>b.onclick=()=>{
    const order = state.orders.find(o=>o.id===b.dataset.deliveryslip);
    if (order) exportDeliverySlipPDF(order);
  });
  root.querySelectorAll("[data-ordercheck]").forEach(cb=>cb.onchange=()=>{
    const id = cb.dataset.ordercheck;
    if (cb.checked) state.selectedOrders.add(id); else state.selectedOrders.delete(id);
    render();
  });
  const selectAllOrders = document.getElementById("selectAllOrders");
  if (selectAllOrders) selectAllOrders.onchange = () => {
    const visibleOrders = state.historyView==='day'
      ? dayViewOrders()
      : state.orders.filter(o=>o.customer_id===state.historyCustomer);
    if (selectAllOrders.checked) visibleOrders.forEach(o=>state.selectedOrders.add(o.id));
    else visibleOrders.forEach(o=>state.selectedOrders.delete(o.id));
    render();
  };
  function currentViewOrders(){
    return state.historyView==='day'
      ? dayViewOrders()
      : state.orders.filter(o=>o.customer_id===state.historyCustomer);
  }
  function ordersForExport(){
    const visible = currentViewOrders();
    const selected = visible.filter(o=>state.selectedOrders.has(o.id));
    return selected.length>0 ? selected : visible;
  }
  function dayRangeLabel(){
    return state.historyRange ? `${state.historyRange.from}_${state.historyRange.to}` : state.historyDate;
  }
  const exportOrdersCsvBtn = document.getElementById("exportOrdersCsvBtn");
  if (exportOrdersCsvBtn) exportOrdersCsvBtn.onclick = () => {
    const list = ordersForExport();
    const label = state.historyView==='day' ? dayRangeLabel() : (custName(state.historyCustomer)||"pelatis").replace(/[^\p{L}\p{N}]+/gu,"-");
    exportOrdersCSV(list, `taksis_order-paraggelies-${label}.csv`);

  if (exportOrdersPdfBtn) exportOrdersPdfBtn.onclick = () => {
    const list = ordersForExport();
    const label = state.historyView==='day' ? dayRangeLabel() : (custName(state.historyCustomer)||"pelatis").replace(/[^\p{L}\p{N}]+/gu,"-");
    const titleLabel = state.historyView==='day' ? (state.historyRange?`${formatDateEL(state.historyRange.from)} – ${formatDateEL(state.historyRange.to)}`:formatDateEL(state.historyDate)) : custName(state.historyCustomer);
    exportOrdersPDF(list, `taksis_order-paraggelies-${label}.pdf`, `Παραγγελίες — ${titleLabel}`);
  };
  const dailyReportCsvBtn = document.getElementById("dailyReportCsvBtn");
  if (dailyReportCsvBtn) dailyReportCsvBtn.onclick = () => exportDailyReportCSV(state.historyDate);
  const dailyReportPdfBtn = document.getElementById("dailyReportPdfBtn");
  if (dailyReportPdfBtn) dailyReportPdfBtn.onclick = () => exportDailyReportPDF(state.historyDate);

  // stock tab
  const exportStockBtn = document.getElementById("exportStockBtn");
  if (exportStockBtn) exportStockBtn.onclick = exportStockCSV;
  const exportStockPdfBtn = document.getElementById("exportStockPdfBtn");
  if (exportStockPdfBtn) exportStockPdfBtn.onclick = exportStockPDF;

  // trash tab
  const TRASH_TABLE_CONFIG = {
    orders: {table:"orders", idCol:"id"},
    customers: {table:"customers", idCol:"id"},
    articles: {table:"articles", idCol:"code"},
    stock_units: {table:"stock_units", idCol:"sscc"},
  };
  root.querySelectorAll("[data-restore]").forEach(b=>b.onclick=async()=>{
    const cfg = TRASH_TABLE_CONFIG[b.dataset.restore];
    if (!cfg) return;
    const {error} = await sb.from(cfg.table).update({deleted_at:null}).eq(cfg.idCol, b.dataset.restoreid);
    if (error) return showToast(`Σφάλμα επαναφοράς: ${error.message}`);
    showToast("Επαναφέρθηκε");
    await Promise.all([loadAll(), loadTrash()]);
  });
  root.querySelectorAll("[data-purge]").forEach(b=>b.onclick=async()=>{
    if (!confirm("Οριστική διαγραφή — δεν μπορεί να αναιρεθεί. Συνέχεια;")) return;

    if (error) return showToast(`Σφάλμα διαγραφής: ${error.message}`);
    showToast("Διαγράφηκε οριστικά");
    await loadTrash();
  });
}

function collectArticleForm(){
  const f = state.editingArticle;
  const codeEl = document.getElementById("f_code");
  if (codeEl){
    f.code = codeEl.value;
    f.name = document.getElementById("f_name").value;
    f.price = document.getElementById("f_price").value;
    f.price_per_kg = document.getElementById("f_price_per_kg").value;
    const custom = {};
    root.querySelectorAll("#customFieldsList .row").forEach(row=>{
      const k = row.querySelector(".cf-key").value;
      const v = row.querySelector(".cf-val").value;
      custom[k] = v;
    });
    f.custom = custom;
  }
}
async function saveArticle(){
  collectArticleForm();
  const f = state.editingArticle;
  if (!f.code || !f.name) return showToast("Κωδικός και όνομα υποχρεωτικά");
  const clean = {code:f.code, name:f.name, price:toNumber(f.price), price_per_kg:toNumber(f.price_per_kg), custom:f.custom||{}};
  if (f.isNew){
    const {error} = await sb.from("articles").insert(clean);
    if (error) return showToast(error.code==="23505" ? "Ο κωδικός υπάρχει ήδη" : `Σφάλμα: ${error.message}`);
  } else {
    const {error} = await sb.from("articles").update(clean).eq("code", f._origCode);
    if (error) return showToast(`Σφάλμα: ${error.message}`);
  }
  state.editingArticle = null;
  await loadAll();
  showToast("Αποθηκεύτηκε");
}
async function saveCustomer(){
  const c = state.editingCustomer;
  const sameAsBilling = document.getElementById("c_delivery_same").checked;
  const clean = {
    id: c.id,
    code: document.getElementById("c_code").value.trim(),
    name: document.getElementById("c_name").value.trim(),
    vat: document.getElementById("c_vat").value.trim(),
    commercial_name: document.getElementById("c_commercial").value.trim(),
    address: document.getElementById("c_address").value.trim(),
    area: document.getElementById("c_area").value.trim(),
    zip: document.getElementById("c_zip").value.trim(),
    city: document.getElementById("c_city").value.trim(),
    country: document.getElementById("c_country").value.trim(),
    phone: document.getElementById("c_phone").value.trim(),
    fax: document.getElementById("c_fax").value.trim(),
    email: document.getElementById("c_email").value.trim(),
    email2: document.getElementById("c_email2").value.trim(),
    notes: document.getElementById("c_notes").value.trim(),
    delivery_same_as_billing: sameAsBilling,
    delivery_address: sameAsBilling ? "" : document.getElementById("c_delivery_address").value.trim(),
    delivery_area: sameAsBilling ? "" : document.getElementById("c_delivery_area").value.trim(),
    delivery_zip: sameAsBilling ? "" : document.getElementById("c_delivery_zip").value.trim(),

  if (error) return showToast(`Σφάλμα: ${error.message}`);
  state.editingCustomer = null;
  await loadAll();
  showToast("Αποθηκεύτηκε");
}

async function doImportStock(){
  const raw = document.getElementById("importText").value;
  const {mappedHeaders, records} = parseStockTable(raw);
  console.log("Αντιστοίχιση στηλών:", document.getElementById("importText").value.split("\n")[0].split(/[,;\t]/).map((h,i)=>`${h.trim()} -> ${mappedHeaders[i]||"(αγνοήθηκε)"}`));
  if (!mappedHeaders.includes("articlecode")) return showToast("Δεν βρέθηκε στήλη Article Code");
  const validRecords = records.filter(r=>r.articlecode);
  if (validRecords.length===0) return showToast("Δεν βρέθηκαν έγκυρες γραμμές");
  const zeroQty = validRecords.filter(r => toNumber(r.volume)===0 && toNumber(r.weight)===0).length;

  // upsert articles (code+name always; price_per_kg only if present in the file, to avoid overwriting manually-set values)
  const articleMap = {};
  const priceMap = {};
  validRecords.forEach(r=>{
    if (!articleMap[r.articlecode]) articleMap[r.articlecode] = r.articlename || r.articlecode;
    if (r.priceperkg !== undefined && String(r.priceperkg).trim() !== "") priceMap[r.articlecode] = toNumber(r.priceperkg);
  });
  let artErrors = 0;
  for (const [code,name] of Object.entries(articleMap)){
    const payload = {code, name};
    if (priceMap[code] !== undefined) payload.price_per_kg = priceMap[code];
    const {error} = await sb.from("articles").upsert(payload, {onConflict:"code"});
    if (error){ console.error("article upsert error", code, error); artErrors++; }
  }

  // upsert stock units
  let lotOk = 0, lotErrors = 0, lastError = null;
  for (const r of validRecords){
    const rec = {
      sscc: r.sscc || uid(),
      article_code: r.articlecode,
      zone: r.zone || "",
      volume_boxes: toNumber(r.volume),
      weight_kg: toNumber(r.weight),
      lot_code: r.lot || "",
      bbd: parseDateFlexible(r.bbd),
      reference: r.reference || "",
      custom: r.custom || {},
    };
    const {error} = await sb.from("stock_units").upsert(rec, {onConflict:"sscc"});
    if (error){ console.error("stock upsert error", rec.sscc, error); lotErrors++; lastError = error; }
    else lotOk++;
  }

  state.showImportStock = false;
  if (lotErrors > 0 || artErrors > 0){
    showToast(`Εισήχθησαν ${lotOk}/${validRecords.length} παρτίδες — σφάλμα: ${lastError?lastError.message:"δείτε console"}`);
  } else if (zeroQty > 0){
    showToast(`Εισήχθησαν ${lotOk} παρτίδες (${zeroQty} με μηδενική ποσότητα — έλεγξε τις στήλες Volume/Weight στο αρχείο)`);
  } else {
    showToast(`Εισήχθησαν ${lotOk} παρτίδες, ${Object.keys(articleMap).length} είδη`);
  }
  await loadAll();
}

async function doImportCustomers(){
  const raw = document.getElementById("importText").value;
  const {mappedHeaders, records} = parseCustomerTable(raw);
  if (!mappedHeaders.includes("name")) return showToast("Δεν βρέθηκε στήλη Name");
  const validRecords = records.filter(r=>r.name);
  if (validRecords.length===0) return showToast("Δεν βρέθηκαν έγκυρες εγγραφές");

  let corruptedCount = 0;
  const corruptedCodes = [];
  const clean = validRecords.map(r=>{
    let phone = r.phone || "", fax = r.fax || "";
    let hadCorruption = false;
    if (isScientificNotation(phone)) { phone = ""; hadCorruption = true; }
    if (isScientificNotation(fax)) { fax = ""; hadCorruption = true; }
    if (hadCorruption) { corruptedCount++; corruptedCodes.push(r.code || r.name); }
    return {
      id: uid(), code: r.code||"", name: r.name, vat: r.vat||"",
      commercial_name: r.commercialname||"", address: r.address||"", area: r.area||"",
      zip: r.zip||"", city: r.city||"", country: r.country||"",
      phone, fax, email: r.email||"", email2: r.email2||"", notes: r.notes||"",
    };
  });

  const {error} = await sb.from("customers").insert(clean);
  state.showImportC = false;
  if (error){
    console.error("import customers error", error);
    showToast(`Σφάλμα εισαγωγής: ${error.message}`);
  } else if (corruptedCount > 0){
    showToast(`Εισήχθησαν ${clean.length} πελάτες — ${corruptedCount} με κατεστραμμένο τηλ./fax (κενό): ${corruptedCodes.slice(0,5).join(", ")}${corruptedCodes.length>5?"...":""}`);
  } else {
    showToast(`Εισήχθησαν ${clean.length} πελάτες`);
  }
  await loadAll();
}

if (configured){ render(); loadAll(); } else { render(); }
